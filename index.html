<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Gallery3D WebGL — a first-person gallery demo</title>
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #05050a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #glcanvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: black;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #e8e6df;
    background: #05050a;
    z-index: 20;
    transition: opacity 0.4s ease;
  }
  #loading h1 { font-weight: 500; letter-spacing: 0.02em; margin-bottom: 0.4em; }
  #loading p { opacity: 0.6; font-size: 0.95em; }
  .hidden { opacity: 0; pointer-events: none; }

  #hud {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 10;
    background: rgba(0, 0, 0, 0.55);
    border: 2px solid rgba(255, 255, 255, 0.25);
    border-radius: 6px;
    padding: 10px 14px;
    color: #fff;
    min-width: 200px;
  }
  #hud .title { font-size: 18px; letter-spacing: 0.04em; margin: 0 0 4px; }
  #hud .sub { font-size: 13px; opacity: 0.7; margin: 0 0 8px; }
  #hud .keys {
    display: grid;
    grid-template-columns: repeat(3, 26px);
    grid-template-rows: repeat(2, 26px);
    gap: 4px;
    justify-content: end;
  }
  #hud .key {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.12);
    border: 1.5px solid rgba(255, 255, 255, 0.5);
    border-radius: 4px;
    font-size: 14px;
  }
  #fps {
    position: fixed;
    top: 120px;
    left: 12px;
    z-index: 10;
    color: rgba(255, 255, 255, 0.55);
    font-size: 13px;
  }

  #touch-controls {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
  }
  .pad-btn {
    position: fixed;
    width: 64px;
    height: 64px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.14);
    border: 2px solid rgba(255, 255, 255, 0.5);
    color: #fff;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    touch-action: none;
  }
  .pad-btn:active, .pad-btn.active {
    background: rgba(255, 255, 255, 0.38);
  }
  #btn-forward { left: 24px; bottom: 100px; }
  #btn-back    { left: 24px; bottom: 24px; }
  #btn-left    { right: 100px; bottom: 24px; }
  #btn-right   { right: 24px; bottom: 24px; }
</style>
</head>
<body>
  <canvas id="glcanvas"></canvas>

  <div id="hud">
    <p class="title">GALLERY3D · WEBGL</p>
    <p class="sub">move / turn</p>
    <div class="keys">
      <div></div><div class="key">&and;</div><div></div>
      <div class="key">&lt;</div><div class="key">v</div><div class="key">&gt;</div>
    </div>
  </div>
  <div id="fps"></div>

  <div id="touch-controls">
    <button class="pad-btn" id="btn-forward">&and;</button>
    <button class="pad-btn" id="btn-back">v</button>
    <button class="pad-btn" id="btn-left">&lt;</button>
    <button class="pad-btn" id="btn-right">&gt;</button>
  </div>

  <div id="loading">
    <h1>Gallery3D</h1>
    <p>Loading gallery&hellip;</p>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
